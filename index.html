
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #030914;
  color: #40cfff;
  font-family: Arial, sans-serif;
  text-align: center;
  min-height: 100vh;
}
header {
  padding: 24px;
  border-bottom: 1px solid #12618a;
  letter-spacing: 5px;
}
h1 { text-shadow: 0 0 15px #00bfff; }
.reactor {
  width: 190px;
  height: 190px;
  margin: 65px auto 25px;
  border: 5px solid #29caff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  box-shadow: 0 0 20px #00bfff,
              inset 0 0 25px #00bfff;
  animation: glow 2s infinite alternate;
}
.core {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #8cecff;
  box-shadow: 0 0 35px #00bfff;
}
@keyframes glow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
#status { margin: 25px; }
button {
  background: transparent;
  border: 1px solid #32cfff;
  color: #40cfff;
  padding: 13px 25px;
  margin: 8px;
  border-radius: 25px;
  cursor: pointer;
}
button:hover {
  background: #07304a;
}
#reply {
  margin: 25px auto;
  padding: 15px;
  max-width: 500px;
  color: white;
}
</style>
</head>
<body>
<header>
  <h1>J.A.R.V.I.S.</h1>
  <p>JUST A RATHER VERY INTELLIGENT SYSTEM</p>
</header>

<div class="reactor">
  <div class="core"></div>
</div>

<h2>STARK INDUSTRIES</h2>
<p id="status">SYSTEM ONLINE</p>

<button onclick="speak()">ACTIVATE JARVIS</button>
<button onclick="listen()">🎙️ TALK TO JARVIS</button>

<div id="reply">WELCOME BACK, SIR.</div>

<script>
function speak() {
  let msg = new SpeechSynthesisUtterance(
    "Welcome back. I am Jarvis. How can I help you?"
  );
  msg.lang = "en-US";
  speechSynthesis.speak(msg);
}

function listen() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    document.getElementById("reply").innerText =
      "Voice recognition is not supported in this browser.";
    return;
  }

  const rec = new Recognition();
  rec.lang = "hi-IN";
  rec.onstart = () => {
    document.getElementById("status").innerText = "LISTENING...";
  };
  rec.onresult = (event) => {
    let text = event.results[0][0].transcript;
    document.getElementById("reply").innerText =
      "YOU SAID: " + text;
    document.getElementById("status").innerText = "SYSTEM ONLINE";
  };
  rec.onerror = () => {
    document.getElementById("status").innerText = "VOICE ERROR";
  };
  rec.onend = () => {
    document.getElementById("status").innerText = "SYSTEM ONLINE";
  };
  rec.start();
}
</script>
</body>
</html>
